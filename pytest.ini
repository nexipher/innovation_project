[pytest]
# Test tiers (§4.17 小收口).  Run only what the change at hand can break:
#
#   pytest -m core        核心不变量（< 1 分钟）：账本、门禁、协议、策略、转换检查
#   pytest -m "not slow"  模块测试：上述之外的全部单元测试（不含会话级/端到端）
#   pytest                全景回归：全部（约 3–4 分钟，含真实图像与 CPU 专家）
#
# `slow` = 会话级测试：每条用例都真的跑 CPU 专家、读写图像与轨迹。
markers =
    core: 核心不变量；任何改动前后都该通过（秒级到分钟级）
    slow: 会话级/端到端用例，代价高；改核心逻辑时才需要跑
